<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Find Food - FOODBRIDGE AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/premium.css">
</head>

<body class="d-flex flex-column min-vh-100">

<!-- FLOATING GLASSNAV -->
<nav class="navbar navbar-expand-lg navbar-floating">
    <div class="container-fluid px-0">
        <a class="navbar-brand fb-brand" href="index.html">
            <img src="images/foodbridge.logo.png" alt="FOODBRIDGE AI Logo" class="fb-logo-img">
            <span class="fb-brand-text">
                <span class="fb-wordmark">
                    <span class="fb-g">FOOD</span><span class="fb-b">BRIDGE</span>
                    <span class="fb-ai-badge">AI</span>
                </span>
                <span class="fb-tagline">REDUCE WASTE. FEED HOPE. CREATE IMPACT.</span>
            </span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <!-- Dynamic navbar content populated by script.js -->
        </div>
    </div>
</nav>

<div class="container pb-5" style="margin-top: 110px !important; max-width: 900px;">
    <div class="text-center mb-4 animate-fade-in">
        <span class="hero-pill-premium mb-2">🍱 Community Food Sharing Network</span>
        <h1 class="fw-extrabold text-success display-6 mb-1">Available Surplus Food</h1>
        <p class="text-secondary">Browse listings, verify quantity, and submit pickup requests instantly.</p>
    </div>

    <!-- SEARCH BOX -->
    <div class="glass-card-premium p-3 mb-4 animate-fade-in">
        <div class="d-flex align-items-center px-2">
            <span class="fs-5 me-2 text-muted">🔍</span>
            <input type="text" id="searchInput" class="form-control border-0 bg-transparent shadow-none text-primary" placeholder="Filter food listings by name, quantity, or location area...">
        </div>
    </div>

    <!-- DYNAMIC FOOD LIST -->
    <div id="findFoodList">
        <div class="text-center py-5">
            <div class="spinner-border text-success" role="status">
                <span class="visually-hidden">Loading food listings...</span>
            </div>
        </div>
    </div>

    <div class="text-center mt-5">
        <a href="index.html" class="text-success text-decoration-none fw-bold small">← Back to Homepage</a>
    </div>
</div>

<footer class="bg-white py-4 mt-auto border-top">
    <div class="container text-center">
        <p class="text-muted mb-0">🌱 FOODBRIDGE AI &copy; 2026. Empowering communities to end food waste.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
